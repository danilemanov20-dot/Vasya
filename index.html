<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One-time 2FA code</title>
<style>
body{font-family:system-ui,sans-serif;text-align:center;background:#000;color:#fff;margin:0;padding:40px 20px;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh}
.container{max-width:500px;width:100%}
h1{font-size:2.5rem;margin:0 0 30px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
#label{font-size:1.4rem;opacity:.9;margin-bottom:40px;font-weight:500}
#code{font-size:4.5rem;font-weight:bold;letter-spacing:10px;margin:40px 0 30px;min-height:80px;text-shadow:0 0 30px rgba(255,255,255,.8),0 0 60px rgba(255,255,255,.4)}
#countdown{font-size:1.4rem;margin-bottom:20px;font-weight:500}
.progress{height:8px;background:#222;margin:20px auto;width:320px;max-width:90%;border-radius:10px;overflow:hidden}
.bar{height:100%;background:linear-gradient(90deg,#fff,#ccc);transition:width 1s linear}
#copy-btn{margin-top:20px;padding:14px 32px;font-size:16px;font-weight:600;text-transform:uppercase;background:#fff;color:#000;border:2px solid #fff;border-radius:8px;cursor:pointer;letter-spacing:1px}
.error{color:#ff6b6b;margin-top:20px;font-size:1rem}
.success{color:#51cf66;margin-top:10px;font-size:1rem}
</style>
</head>
<body>
<div class="container">
  <h1>One-time 2FA code</h1>
  <div id="label">Wantrelaxx - fanpay</div>
  <div id="code">------</div>
  <div class="progress"><div id="bar" class="bar" style="width:100%"></div></div>
  <div id="countdown">Update in <span id="time">30</span>s</div>
  <button id="copy-btn">Copy</button>
  <div id="error" class="error"></div>
  <div id="success" class="success"></div>
</div>
<script>
// Секрет берётся из адреса вида https://сайт/#СЕКРЕТ (один раз),
// после чего сохраняется в localStorage этого браузера, а из адресной строки удаляется.
let secretBase32 = '';
try {
  const h = decodeURIComponent(location.hash.slice(1)).replace(/\s+/g, '');
  if (h) {
    localStorage.setItem('totp_secret', h);
    history.replaceState(null, '', location.pathname + location.search);
  }
  secretBase32 = localStorage.getItem('totp_secret') || '';
} catch (e) {}
// Либо впиши секрет прямо сюда (тогда он виден всем, у кого есть доступ к странице):
// secretBase32 = 'ВАШ_СЕКРЕТ';

function $(id) { return document.getElementById(id); }

function flash(id, msg, ms) {
  $(id).textContent = msg;
  setTimeout(function () { $(id).textContent = ''; }, ms);
}

$('copy-btn').addEventListener('click', async function () {
  const text = $('code').textContent;
  if (text === '------') { flash('error', 'Code not ready yet!', 3000); return; }
  try {
    await navigator.clipboard.writeText(text);
    flash('success', 'Code copied!', 2000);
    $('copy-btn').textContent = 'Copied!';
    setTimeout(function () { $('copy-btn').textContent = 'Copy'; }, 2000);
  } catch (err) {
    flash('error', 'Error copying code', 3000);
  }
});

function base32ToBytes(b32) {
  const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  let bits = '';
  for (const ch of b32.toUpperCase()) {
    const v = alphabet.indexOf(ch);
    if (v === -1) continue;
    bits += v.toString(2).padStart(5, '0');
  }
  const bytes = new Uint8Array(Math.floor(bits.length / 8));
  for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(bits.substr(i * 8, 8), 2);
  return bytes;
}

async function generateTOTP(secret) {
  const key = base32ToBytes(secret);
  const counter = Math.floor(Date.now() / 1000 / 30);
  const buf = new ArrayBuffer(8);
  new DataView(buf).setBigUint64(0, BigInt(counter), false);
  const cryptoKey = await crypto.subtle.importKey('raw', key, { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
  const hmac = new Uint8Array(await crypto.subtle.sign('HMAC', cryptoKey, buf));
  const o = hmac[hmac.length - 1] & 0x0f;
  const code = ((hmac[o] & 0x7f) << 24) | (hmac[o + 1] << 16) | (hmac[o + 2] << 8) | hmac[o + 3];
  return (code % 1000000).toString().padStart(6, '0');
}

function tick() {
  const now = Math.floor(Date.now() / 1000);
  const remaining = 30 - (now % 30);
  $('time').textContent = remaining;
  $('bar').style.width = (remaining / 30 * 100) + '%';
  if (!secretBase32) {
    $('error').textContent = 'Secret not set. Open the page as /#YOUR_SECRET once.';
    return;
  }
  generateTOTP(secretBase32).then(function (c) {
    $('code').textContent = c;
    $('error').textContent = '';
  }).catch(function (e) {
    $('error').textContent = 'Error: ' + e.message;
  });
}

window.addEventListener('load', function () { tick(); setInterval(tick, 1000); });
</script>
</body>
</html>
